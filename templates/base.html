<!-- base.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VertexDoc AI · Intelligent Document Assistant</title>
    <link rel="icon" href="">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="app-shell" id="app-shell">
    {% block app %}{% endblock %}
</div>

<!-- Flash messages -> toasts -->
<div class="toast-stack" id="toast-stack" aria-live="polite">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="toast toast-{{ category }}">
                    <span class="toast-dot"></span>
                    <span class="toast-msg">{{ message }}</span>
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}
</div>

<!-- Reading / analyzing overlay -->
<div id="loading-spinner" class="scan-overlay">
    <div class="scan-box">
        <div class="scan-page">
            <span class="scan-line"></span>
            <span class="scan-page-row"></span>
            <span class="scan-page-row"></span>
            <span class="scan-page-row short"></span>
            <span class="scan-page-row"></span>
            <span class="scan-page-row short"></span>
        </div>
        <p class="scan-label">AI is reading your document<span class="ellipsis"><i>.</i><i>.</i><i>.</i></span></p>
    </div>
</div>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
